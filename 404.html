<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Katorly Lab</title>
    <meta name="description" content="Sorry, we couldn't find the page you're looking for. Return to Katorly Lab homepage.">
    <meta name="keywords" content="Katorly Lab, Katorly, katorlylab, katorlys, katorly, 404, page not found">
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Lexend', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Open Sans', sans-serif;
        }

        body {
            background-image: url('images/background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333333;
        }

        .container {
            max-width: 37.5rem;
            width: 90%;
            padding: 2.5rem;
            background-color: #ffffff50;
            border-radius: 1.25rem;
            box-shadow: 0 0.625rem 1.875rem #0000001a;
            text-align: center;
            backdrop-filter: blur(1rem);
            border: 0.0625rem solid #ffffff2e;
            opacity: 0;
            transform: translateY(1.25rem);
            animation: fadeIn 0.8s ease forwards 0.3s;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .badge {
            display: inline-block;
            color: #FF4757;
            padding: 0.375rem 0.75rem;
            border-radius: 1.25rem;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            border: 0.125rem solid #FF4757;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 3rem;
            margin-bottom: 1.25rem;
            line-height: 1.2;
        }

        p {
            font-size: 1.2rem;
            color: #444444;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        .btn-circle {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 3.75rem;
            height: 3.75rem;
            background-color: #FF4757;
            color: white;
            border-radius: 50%;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 0.25rem 0.9375rem #ff475766;
        }

        .btn-circle:hover,
        .btn-circle:focus,
        .btn-circle:focus-visible {
            transform: translateY(-0.1875rem);
            box-shadow: 0 0.375rem 1.25rem #ff475799;
            outline: none;
        }

        .btn-circle:active {
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            p {
                font-size: 1rem;
            }

            .container {
                padding: 1.875rem;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }

            .btn-circle {
                width: 3.125rem;
                height: 3.125rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="badge">404</div>
        <h1>Page Not Found</h1>
        <p>Sorry, we couldn't find the page you're looking for.</p>
        <a href="/" class="btn-circle" aria-label="Go Home">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </a>
    </div>
</body>

</html>
